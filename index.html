<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <title>Notícias - Banco Imobiliário</title>
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0056b3">
    
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="img/icon.png">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #ffffff;
            font-family: 'Verdana', sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Container do Botão Imagem (Carta Principal) */
        #btn-noticia-container {
            width: 75vw;
            height: 75vh;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            border-radius: 20px;
            overflow: hidden;
        }

        #btn-noticia-container:active {
            transform: scale(0.96);
        }

        /* Imagem da Notícia mantendo proporções sem esticar no TTS */
        #img-noticia {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            object-fit: contain;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        /* Botão Atualizar (Posicionado de forma fixa e tamanho absoluto em px para o TTS) */
        #btn-refresh {
            position: absolute;
            bottom: 15px;
            right: 15px;
            width: 48px;
            height: 48px;
            background-color: #ffffff;
            border: 2px solid #0056b3;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
            z-index: 500;
            cursor: pointer;
        }

        #btn-refresh:active {
            transform: scale(0.9);
        }

        #btn-refresh img {
            width: 24px;
            height: 24px;
            object-fit: contain;
        }

        /* Modal de Exibição */
        #modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        #modal-conteudo {
            background: #ffffff;
            padding: 30px;
            border-radius: 20px;
            width: 80vw;             /* Ocupa sempre 80% da largura da viewport/tela */
            max-height: 85vh;        /* Mantém o limite de altura para não estourar a tela na vertical */
            overflow-y: auto;
            text-align: center;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.5);
        }

        .noticia-mensagem { 
            display: block;
            color: #333333; 
            font-size: 22px; 
            line-height: 1.4; 
            font-weight: bold;
        }

        .noticia-valor { 
            display: block; 
            margin-top: 20px; 
            font-weight: bold; 
            font-size: 32px; 
        }

        .sorte { color: #28a745; }
        .azar { color: #dc3545; }
        .neutro, .totem { color: #0056b3; }
    </style>
</head>
<body>

    <div id="btn-noticia-container" onclick="sortearNoticia()">
        <img src="img/noticia.png" id="img-noticia" alt="Botão Notícia">
    </div>

    <div id="btn-refresh" onclick="location.reload()">
        <img src="img/refresh.png" alt="Atualizar">
    </div>

    <div id="modal-overlay" onclick="fecharModal()">
        <div id="modal-conteudo">
            <div id="container-noticia"></div>
        </div>
    </div>

    <audio id="audio-sorte" src="sounds/success.mp3" preload="auto"></audio>
    <audio id="audio-azar" src="sounds/fail.mp3" preload="auto"></audio>
    <audio id="audio-noticia" src="sounds/noticia.mp3" preload="auto"></audio>

    <script type="module">
        import { noticiasOriginais } from './noticias.js';

        // Service Worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').then(reg => reg.update());
        }

        const audioSorte = document.getElementById('audio-sorte');
        const audioAzar = document.getElementById('audio-azar');
        const audioNoticia = document.getElementById('audio-noticia');

        let noticiasAtuais = [...noticiasOriginais];

        window.sortearNoticia = function() {
            if (noticiasAtuais.length === 0) {
                noticiasAtuais = [...noticiasOriginais];
            }

            const indice = Math.floor(Math.random() * noticiasAtuais.length);
            const noticia = noticiasAtuais[indice];
            noticiasAtuais.splice(indice, 1);

            // Toca o áudio correspondente
            const player = noticia.tipo === "sorte" ? audioSorte : 
                           noticia.tipo === "azar" ? audioAzar : audioNoticia;
            
            player.currentTime = 0;
            player.play().catch(e => console.log("Áudio bloqueado pelo navegador"));

            // Preenche o modal
            const container = document.getElementById('container-noticia');
            container.innerHTML = `
                <span class="noticia-mensagem">${noticia.msg}</span>
                <span class="noticia-valor ${noticia.tipo}">${noticia.valor}</span>
            `;

            document.getElementById('modal-overlay').style.display = 'flex';
        }

        window.fecharModal = function() {
            document.getElementById('modal-overlay').style.display = 'none';
            [audioSorte, audioAzar, audioNoticia].forEach(a => a.pause());
        }
    </script>
</body>
</html>
