<meta

<title>Notícias - Banco Imobiliário</title>

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta
    name="apple-mobile-web-app-status-bar-style"

<style>

    /* =========================================================
       RESET
       ========================================================= */

    *,
    *::before,
    *::after {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }


    /* =========================================================
       HTML / BODY
       ========================================================= */

    html {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;

        background-color: #ffffff;
    }

    body {
        width: 100%;
        height: 100%;

        min-width: 0;
        min-height: 0;

        margin: 0;
        padding: 0;

        display: flex;
        justify-content: center;
        align-items: center;

        background-color: #ffffff;

        font-family: Verdana, sans-serif;

        overflow: hidden;

        /*
         * Impede seleção acidental de texto no tablet
         */
        -webkit-user-select: none;
        user-select: none;

        /*
         * Melhora a resposta ao toque
         */
        touch-action: manipulation;
    }


    /* =========================================================
       BOTÃO PRINCIPAL - NOTÍCIA
       ========================================================= */

    #btn-noticia-container {

        /*
         * O botão será sempre quadrado.
         *
         * 72vmin significa:
         * - pega o menor entre largura e altura da tela;
         * - usa 72% desse tamanho.
         *
         * Isso evita que o botão seja maior que a tela
         * quando o tablet muda de proporção.
         */
        width: min(72vmin, 620px);

        aspect-ratio: 1 / 1;

        /*
         * Garante que nunca ultrapasse a área disponível.
         */
        max-width: calc(100vw - 40px);
        max-height: calc(100vh - 40px);

        display: flex;
        justify-content: center;
        align-items: center;

        cursor: pointer;

        border-radius: 10%;

        overflow: hidden;

        transition: transform 0.1s ease;

        /*
         * Evita que o navegador tente selecionar/
         * arrastar a imagem.
         */
        -webkit-user-select: none;
        user-select: none;
    }


    #btn-noticia-container:active {
        transform: scale(0.95);
    }


    /* =========================================================
       IMAGEM DA NOTÍCIA
       ========================================================= */

    #img-noticia {

        display: block;

        width: 100%;
        height: 100%;

        /*
         * A imagem original é quadrada.
         *
         * "contain" preserva completamente a imagem,
         * evitando distorções ou cortes.
         */
        object-fit: contain;

        border-radius: 10%;

        box-shadow:
            0 2vmin 5vmin rgba(0, 0, 0, 0.20);

        pointer-events: none;
    }


    /* =========================================================
       BOTÃO ATUALIZAR
       ========================================================= */

    #btn-refresh {

        position: fixed;

        /*
         * Margem responsiva.
         *
         * env() ajuda em dispositivos que possuem
         * áreas de segurança.
         */
        right: max(
            16px,
            env(safe-area-inset-right)
        );

        bottom: max(
            16px,
            env(safe-area-inset-bottom)
        );


        /*
         * Tamanho baseado na menor dimensão da tela,
         * mas limitado entre 52px e 90px.
         */
        width: clamp(52px, 10vmin, 90px);

        aspect-ratio: 1 / 1;

        height: auto;

        padding: 0;

        display: flex;
        justify-content: center;
        align-items: center;

        background-color: #ffffff;

        border: clamp(
            2px,
            0.5vmin,
            5px
        ) solid #0056b3;

        border-radius: 50%;

        box-shadow:
            0 1vmin 3vmin rgba(0, 0, 0, 0.20);

        z-index: 500;

        cursor: pointer;

        touch-action: manipulation;
    }


    #btn-refresh:active {
        transform: scale(0.92);
    }


    #btn-refresh img {

        width: 55%;
        height: 55%;

        object-fit: contain;

        pointer-events: none;
    }


    /* =========================================================
       MODAL
       ========================================================= */

    #modal-overlay {

        display: none;

        position: fixed;

        inset: 0;

        width: 100%;
        height: 100%;

        /*
         * Espaçamento para impedir que o modal
         * encoste nas bordas da tela.
         */
        padding: clamp(16px, 4vmin, 40px);

        background: rgba(0, 0, 0, 0.90);

        justify-content: center;
        align-items: center;

        z-index: 1000;

        /*
         * Garante que o conteúdo não fique
         * atrás de áreas de segurança.
         */
        padding-top: max(
            16px,
            env(safe-area-inset-top)
        );

        padding-right: max(
            16px,
            env(safe-area-inset-right)
        );

        padding-bottom: max(
            16px,
            env(safe-area-inset-bottom)
        );

        padding-left: max(
            16px,
            env(safe-area-inset-left)
        );
    }


    /* =========================================================
       CONTEÚDO DO MODAL
       ========================================================= */

    #modal-conteudo {

        width: min(
            92vw,
            850px
        );

        max-width: 100%;

        max-height: 88vh;

        /*
         * Compatibilidade com navegadores que suportam
         * Dynamic Viewport Height.
         */
        max-height: 88dvh;

        /*
         * Espaçamento responsivo.
         */
        padding: clamp(
            20px,
            4vmin,
            50px
        );

        background-color: #ffffff;

        border-radius: clamp(
            16px,
            4vmin,
            40px
        );

        text-align: center;

        box-shadow:
            0 0 10vmin rgba(0, 0, 0, 0.50);

        /*
         * Se uma notícia for muito grande,
         * permite rolagem somente dentro do modal.
         */
        overflow-y: auto;

        overflow-x: hidden;

        /*
         * Melhora a rolagem em dispositivos touch.
         */
        -webkit-overflow-scrolling: touch;
    }


    /* =========================================================
       TEXTO DA NOTÍCIA
       ========================================================= */

    .noticia-mensagem {

        display: block;

        color: #333333;

        /*
         * O tamanho agora se adapta à tela,
         * mas possui limite mínimo e máximo.
         */
        font-size: clamp(
            20px,
            4vmin,
            48px
        );

        line-height: 1.25;

        overflow-wrap: break-word;
        word-wrap: break-word;
    }


    /* =========================================================
       VALOR DA NOTÍCIA
       ========================================================= */

    .noticia-valor {

        display: block;

        margin-top: clamp(
            16px,
            3vmin,
            35px
        );

        font-weight: bold;

        font-size: clamp(
            24px,
            5vmin,
            60px
        );

        line-height: 1.2;

        overflow-wrap: break-word;
        word-wrap: break-word;
    }


    /* =========================================================
       CORES
       ========================================================= */

    .sorte {
        color: #28a745;
    }

    .azar {
        color: #dc3545;
    }

    .neutro,
    .totem {
        color: #0056b3;
    }


    /* =========================================================
       TABLETS / TELAS PEQUENAS
       ========================================================= */

    @media (max-width: 600px) {

        #btn-noticia-container {

            width: 78vmin;

            max-width: calc(100vw - 30px);
            max-height: calc(100vh - 30px);
        }

        #modal-conteudo {

            width: 94vw;

            padding: clamp(
                18px,
                5vmin,
                30px
            );
        }
    }


    /* =========================================================
       LANDSCAPE
       ========================================================= */

    @media (orientation: landscape) {

        /*
         * Em landscape usamos a altura como referência,
         * porque normalmente ela será a menor dimensão.
         */
        #btn-noticia-container {

            width: min(
                72vh,
                620px
            );

            max-width: calc(100vw - 40px);

            max-height: calc(100vh - 40px);
        }

        .noticia-mensagem {

            font-size: clamp(
                20px,
                4vmin,
                44px
            );
        }

        .noticia-valor {

            font-size: clamp(
                24px,
                5vmin,
                56px
            );
        }
    }


    /* =========================================================
       LANDSCAPE COM POUCA ALTURA
       ========================================================= */

    @media (
        orientation: landscape
    ) and (
        max-height: 500px
    ) {

        #btn-noticia-container {

            width: min(
                70vh,
                500px
            );
        }

        #btn-refresh {

            width: clamp(
                46px,
                9vmin,
                70px
            );
        }
    }


    /* =========================================================
       TELAS MUITO PEQUENAS
       ========================================================= */

    @media (
        max-width: 400px
    ) {

        #btn-noticia-container {

            width: 76vmin;
        }

        #modal-conteudo {

            width: 95vw;

            padding: 18px;

            border-radius: 18px;
        }

        .noticia-mensagem {

            font-size: clamp(
                18px,
                5vmin,
                30px
            );
        }

        .noticia-valor {

            font-size: clamp(
                22px,
                6vmin,
                36px
            );
        }
    }

</style>

```
<!-- =========================================================
     BOTÃO PRINCIPAL
     ========================================================= -->

<div
    id="btn-noticia-container"
    onclick="sortearNoticia()"
>

    <img
        src="img/noticia.png"
        id="img-noticia"
        alt="Botão Notícia"
    >

</div>


<!-- =========================================================
     BOTÃO ATUALIZAR
     ========================================================= -->

<div
    id="btn-refresh"
    onclick="location.reload()"
>

    <img
        src="img/refresh.png"
        alt="Atualizar"
    >

</div>


<!-- =========================================================
     MODAL
     ========================================================= -->

<div
    id="modal-overlay"
    onclick="fecharModal()"
>

    <div
        id="modal-conteudo"
        onclick="event.stopPropagation()"
    >

        <div id="container-noticia"></div>

    </div>

</div>


<!-- =========================================================
     ÁUDIOS
     ========================================================= -->

<audio
    id="audio-sorte"
    src="sounds/success.mp3"
    preload="auto"
></audio>

<audio
    id="audio-azar"
    src="sounds/fail.mp3"
    preload="auto"
></audio>

<audio
    id="audio-noticia"
    src="sounds/noticia.mp3"
    preload="auto"
></audio>


<!-- =========================================================
     JAVASCRIPT
     ========================================================= -->

<script type="module">

    import {
        noticiasOriginais
    } from './noticias.js';


    /* =====================================================
       SERVICE WORKER
       ===================================================== */

    if ('serviceWorker' in navigator) {

        navigator.serviceWorker
            .register('sw.js')
            .then(reg => reg.update());

    }


    /* =====================================================
       ÁUDIOS
       ===================================================== */

    const audioSorte =
        document.getElementById('audio-sorte');

    const audioAzar =
        document.getElementById('audio-azar');

    const audioNoticia =
        document.getElementById('audio-noticia');


    /* =====================================================
       NOTÍCIAS
       ===================================================== */

    let noticiasAtuais =
        [...noticiasOriginais];


    /* =====================================================
       SORTEAR NOTÍCIA
       ===================================================== */

    window.sortearNoticia = function () {

        /*
         * Quando todas as notícias forem utilizadas,
         * reinicia a lista.
         */
        if (noticiasAtuais.length === 0) {

            noticiasAtuais =
                [...noticiasOriginais];

        }


        /*
         * Escolhe uma notícia aleatória.
         */
        const indice =
            Math.floor(
                Math.random() *
                noticiasAtuais.length
            );


        const noticia =
            noticiasAtuais[indice];


        /*
         * Remove a notícia da lista atual
         * para evitar repetição até que todas
         * sejam utilizadas.
         */
        noticiasAtuais.splice(
            indice,
            1
        );


        /* =================================================
           ÁUDIO
           ================================================= */

        const player =
            noticia.tipo === "sorte"
                ? audioSorte
                : noticia.tipo === "azar"
                    ? audioAzar
                    : audioNoticia;


        player.currentTime = 0;


        player
            .play()
            .catch(
                e =>
                    console.log(
                        "Áudio bloqueado pelo navegador"
                    )
            );


        /* =================================================
           PREENCHE MODAL
           ================================================= */

        const container =
            document.getElementById(
                'container-noticia'
            );


        container.innerHTML = `

            <span class="noticia-mensagem">
                ${noticia.msg}
            </span>

            <span
                class="noticia-valor ${noticia.tipo}"
            >
                ${noticia.valor}
            </span>

        `;


        /* =================================================
           EXIBE MODAL
           ================================================= */

        document
            .getElementById('modal-overlay')
            .style
            .display = 'flex';

    };


    /* =====================================================
       FECHAR MODAL
       ===================================================== */

    window.fecharModal = function () {

        document
            .getElementById('modal-overlay')
            .style
            .display = 'none';


        /*
         * Para todos os áudios.
         */
        [
            audioSorte,
            audioAzar,
            audioNoticia
        ].forEach(
            audio => audio.pause()
        );

    };

</script>
